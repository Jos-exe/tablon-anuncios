{% extends "base.html" %}
{% block titulo %}Anuncio{% endblock %}

{% block contenido %}
<h2>{{ 'Modificar' if anuncio else 'Nuevo' }} anuncio</h2>

<form method="post" class="col-md-7">
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control"
               value="{{ anuncio.titulo if anuncio else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Categoria</label>
        <select name="categoria_id" class="form-select" required>
            {% for c in categorias %}
            <option value="{{ c.id }}" {{ 'selected' if anuncio and anuncio.categoria_id == c.id else '' }}>
                {{ c.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Contenido</label>
        <textarea name="contenido" rows="5" class="form-control" required>{{ anuncio.contenido if anuncio else '' }}</textarea>
    </div>
    <button class="btn btn-success">Guardar</button>
    <a href="{{ url_for('anuncios.listar') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
