{% extends "base.html" %}
{% block titulo %}Usuario{% endblock %}

{% block contenido %}
<h2>{{ 'Modificar' if usuario else 'Nuevo' }} usuario</h2>

<form method="post" class="col-md-5">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control"
               value="{{ usuario.nombre if usuario else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="email" class="form-control"
               value="{{ usuario.email if usuario else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña {% if usuario %}{% endif %}</label>
        <input type="password" name="password" class="form-control" {{ '' if usuario else 'required' }}>
    </div>
    <button class="btn btn-success">Guardar</button>
    <a href="{{ url_for('usuarios.listar') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
